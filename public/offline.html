<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121619">
  <title>MULTIBOT 面板 · 离线</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1214;
      --surface: #15191d;
      --border: rgba(214, 226, 235, 0.1);
      --text: #f2f5f7;
      --muted: #85929c;
      --accent: #3399ff;
      --mono: "Cascadia Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI Variable Text", "Microsoft YaHei UI", "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    body {
      display: grid;
      place-items: center;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
    }

    .card {
      width: min(420px, 100%);
      padding: 22px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      text-align: center;
    }

    .mark {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(51, 153, 255, 0.3);
      border-radius: 6px;
      background: rgba(51, 153, 255, 0.13);
      color: #79baff;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 650;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
    }

    button {
      min-height: 36px;
      padding: 6px 18px;
      border: 1px solid #2c8fe9;
      border-radius: 6px;
      background: var(--accent);
      color: #07121a;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">MB</div>
    <h1>当前处于离线状态</h1>
    <p>面板外壳已缓存，但后端连接与实时数据需要联网。恢复网络后点下面按钮重试。</p>
    <button type="button" onclick="location.reload()">重新加载</button>
  </div>
</body>
</html>
